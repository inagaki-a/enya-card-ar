<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>カメラ単体テスト</title>
<style>
body{margin:0;padding:16px;font-family:sans-serif;background:#f6efe4;color:#3a2e22;line-height:1.7}
button{font-size:20px;padding:14px 32px;border:0;border-radius:40px;background:#8a6a45;color:#fff}
video{display:block;width:100%;max-width:420px;margin:14px 0;background:#000;border:3px solid #8a6a45;min-height:200px}
pre{white-space:pre-wrap;word-break:break-all;background:#fff;padding:10px;border-radius:8px;font-size:13px}
</style></head><body>
<h2 style="margin:0 0 8px">カメラ単体テスト</h2>
<p>ARを使わず、カメラが映るかだけを確認します。ボタンを押して、許可を求められたら「許可」を押してください。</p>
<button id="b">カメラをテスト</button>
<video id="v" playsinline autoplay muted></video>
<pre id="log"></pre>
<script>
const log = m => document.getElementById('log').textContent += m + '\n';
log('ブラウザ: ' + navigator.userAgent);
log('https接続: ' + window.isSecureContext + ' ／ カメラAPI: ' + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia));
document.getElementById('b').onclick = async () => {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    const v = document.getElementById('v'); v.srcObject = s; await v.play();
    const t = s.getVideoTracks()[0]; const st = t.getSettings();
    log('✅ カメラ起動成功: ' + t.label + ' ' + st.width + 'x' + st.height);
    v.addEventListener('loadedmetadata', () => log('映像サイズ: ' + v.videoWidth + 'x' + v.videoHeight));
  } catch (e) { log('❌ 失敗: ' + e.name + ' / ' + e.message); }
};
</script></body></html>
