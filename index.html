<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>縁家 名刺AR</title>
<!-- 方式: MindAR + three.js。ライブラリは自サイトに同梱（外部CDNに依存しない）。縁つむぐの名刺ARと同じ構成。 -->
<script type="importmap">
{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}
</script>
<style>
  html, body { margin: 0; height: 100%; background: #f6efe4; font-family: 'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif; }
  #ar { position: fixed; inset: 0; background: #000; visibility: hidden; touch-action: manipulation; }
  #ar video { object-fit: cover; }
  #start { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
           background: #f6efe4; color: #5a4632; text-align: center; padding: 24px; overflow: auto; }
  #start button { margin-top: 24px; font-size: 20px; padding: 16px 40px; border: 0; border-radius: 40px; background: #8a6a45; color: #fff; }
  #start button:disabled { opacity: .6; }
  #err { display: none; margin: 18px 0 0; padding: 12px 16px; max-width: 420px; border: 1px dashed #bf7400; border-radius: 8px;
         background: #fbf1df; color: #7a4b0e; font-size: 15px; line-height: 1.8; text-align: left; }
  #inapp { display: none; margin-top: 18px; max-width: 420px; padding: 12px 14px; border-radius: 10px; background: #fff3d6; font-size: 14px; line-height: 1.7; text-align: left; }
  #hint { position: fixed; left: 0; right: 0; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 5; text-align: center; color: #fff;
          font-size: 16px; text-shadow: 0 0 4px #000; pointer-events: none; display: none; }
  #close { position: fixed; z-index: 6; top: max(12px, env(safe-area-inset-top)); right: 12px; display: none; min-height: 44px; padding: 0 16px;
           border-radius: 999px; border: 0; background: rgba(246,239,228,.95); color: #3a2e22; font: inherit; font-size: 14px; }
  #dbg { position: fixed; top: 0; left: 0; right: 0; z-index: 2147483647; margin: 0; padding: 6px; background: rgba(0,0,0,.75); color: #7CFC00;
         font-size: 11px; line-height: 1.4; white-space: pre-wrap; max-height: 55%; overflow: auto; pointer-events: none; display: none; }
</style>
</head>
<body>
<div id="ar"></div>

<div id="start">
  <div style="font-size:22px;font-weight:bold;">縁家の名刺をかざしてください</div>
  <div style="margin-top:12px;font-size:15px;line-height:1.8;">ボタンを押すとカメラが起動します。<br>映像は端末内で処理され、保存・送信されません。</div>
  <button id="startBtn" type="button">はじめる</button>
  <p id="err" role="alert"></p>
  <div id="inapp"><b>⚠ このままではカメラが使えない場合があります</b><br>LINE・Instagramなどのアプリ内で開いています。画面右上（または右下）のメニューから<b>「Safariで開く」「ブラウザで開く」「Chromeで開く」</b>を選んで開き直してください。</div>
</div>
<div id="hint">名刺全体が映るようにかざしてください</div>
<button id="close" type="button">とじる</button>
<pre id="dbg"></pre>

<script type="module">
import * as THREE from 'three';

const $ = (id) => document.getElementById(id);
window.__ar = { state: 'idle', found: {} };

// ?debug=1 のときだけ、動作の段階を画面上部に表示（原因調査用）
const DEBUG = /[?&]debug=1/.test(location.search);
const t0 = Date.now();
function L(m) { if (!DEBUG) return; const d = $('dbg'); d.style.display = 'block'; d.textContent += ((Date.now() - t0) / 1000).toFixed(1) + 's ' + m + String.fromCharCode(10); }
window.addEventListener('error', (e) => L('ERROR ' + e.message));
window.addEventListener('unhandledrejection', (e) => L('REJECT ' + (e.reason && (e.reason.name + ' ' + e.reason.message))));
L('page loaded / ' + navigator.userAgent.slice(0, 100));

if (/Line\/|FBAN|FBAV|Instagram|MicroMessenger|Twitter|KAKAOTALK|Messenger/i.test(navigator.userAgent)) $('inapp').style.display = 'block';

function showError(msg) {
  const e = $('err'); e.innerHTML = msg; e.style.display = 'block';
  $('startBtn').disabled = false; $('startBtn').textContent = 'もう一度ためす';
}

// 縦動画 406x720 の比率。名刺の幅（=1）に対する大きさ。
const VIDEO_W = 0.8, VIDEO_H = 1.42;
const TARGETS = 2;   // 0: 面1（縁家）／1: 面2（pu-a-pu）。どちらをかざしても同じ動画が流れる

async function start() {
  const btn = $('startBtn'); btn.disabled = true; btn.textContent = 'カメラを起動しています…';
  $('err').style.display = 'none'; $('ar').innerHTML = '';
  L('はじめる押下');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError('この表示方法ではカメラを使えません。<br>LINE・Instagramなどのアプリ内ではなく、<b>Safari（iPhone）／Chrome（Android）</b>で開き直してください。'); return;
  }

  // 動画: タップ操作の中で再生権限を得ておく（iPhone対策）
  const video = document.createElement('video');
  video.src = './video.mp4'; video.loop = true; video.playsInline = true; video.setAttribute('webkit-playsinline', '');
  video.preload = 'auto'; video.muted = false;
  try { await video.play(); video.pause(); video.currentTime = 0; } catch (e) { L('video unlock: ' + e.name); }

  let MindARThree;
  try { ({ MindARThree } = await import('./vendor/mindar-image-three.prod.js')); L('mindar module OK'); }
  catch (e) { console.error(e); L('import失敗 ' + e.message); showError('読み込みに失敗しました。電波の良い場所で、もう一度ためしてください。'); return; }

  const mindar = new MindARThree({
    container: $('ar'),
    imageTargetSrc: './target.mind',
    uiLoading: 'no', uiScanning: 'no', uiError: 'no',
  });
  const { renderer, scene, camera } = mindar;

  const tex = new THREE.VideoTexture(video); tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshBasicMaterial({ map: tex });
  for (let i = 0; i < TARGETS; i++) {
    const anchor = mindar.addAnchor(i);
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(VIDEO_W, VIDEO_H), mat);
    plane.position.z = 0.01; anchor.group.add(plane);
    anchor.onTargetFound = () => { window.__ar.found[i] = true; L('FOUND ' + i); $('hint').style.display = 'none'; video.play().catch(() => {}); };
    anchor.onTargetLost = () => { delete window.__ar.found[i]; L('LOST ' + i); if (!Object.keys(window.__ar.found).length) { video.pause(); $('hint').style.display = 'block'; } };
  }

  try { L('mindar.start()'); await mindar.start(); L('mindar started'); }
  catch (e) {
    console.error(e); L('start失敗 ' + (e && (e.name + ' ' + e.message)));
    try { mindar.stop(); } catch (_) {}
    $('ar').style.visibility = 'hidden';
    const n = String((e && (e.name || e.message)) || e);
    showError(/permission|denied|NotAllowed|Security/i.test(n)
      ? 'カメラの使用が許可されていません。<br>スマホの設定で、このブラウザのカメラを「許可」にして、もう一度ためしてください。'
      : /NotFound|Overconstrained/i.test(n)
        ? 'カメラが見つかりません。カメラのある端末（スマホ）で開いてください。'
        : 'カメラを起動できませんでした。<br>LINE・Instagramなどのアプリ内ではなく、<b>Safari（iPhone）／Chrome（Android）</b>で開き直してください。');
    return;
  }
  $('start').style.display = 'none'; $('ar').style.visibility = 'visible';
  $('hint').style.display = 'block'; $('close').style.display = 'block';
  window.__ar.state = 'running';
  renderer.setAnimationLoop(() => renderer.render(scene, camera));

  $('close').onclick = () => {
    renderer.setAnimationLoop(null); mindar.stop(); video.pause();
    $('ar').style.visibility = 'hidden'; $('hint').style.display = 'none'; $('close').style.display = 'none';
    $('start').style.display = 'flex'; btn.disabled = false; btn.textContent = 'もう一度はじめる'; window.__ar.state = 'idle';
  };
}
$('startBtn').addEventListener('click', start);
</script>
</body>
</html>
